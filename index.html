<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALGIZ DJ</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050505;
color:white;
}

header{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.8)),
url("https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?auto=format&fit=crop&w=1800&q=80");
background-size:cover;
background-position:center;
}

h1{
font-size:70px;
color:#00e5ff;
text-shadow:0 0 25px #00e5ff;
}

h2{
font-size:26px;
margin-top:20px;
letter-spacing:3px;
}

.button{
display:inline-block;
margin-top:35px;
padding:15px 35px;
background:#00e5ff;
color:black;
text-decoration:none;
border-radius:30px;
font-weight:bold;
transition:.3s;
}

.button:hover{
transform:scale(1.08);
}

section{
padding:80px 20px;
max-width:1100px;
margin:auto;
}

.title{
font-size:40px;
margin-bottom:40px;
text-align:center;
color:#00e5ff;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.gallery img{
width:100%;
border-radius:15px;
}

footer{
padding:40px;
text-align:center;
background:#000;
}
</style>

</head>

<body>

<header>

<div>

<h1>ALGIZ</h1>

<h2>DJ • PRODUCER • TECH HOUSE • BASS HOUSE</h2>

<a class="button" href="#galeria">Zobacz galerię</a>

</div>

</header>

<section>

<h2 class="title">O mnie</h2>

<p style="font-size:20px;line-height:1.8;text-align:center;">
Jestem DJ-em i producentem muzyki elektronicznej.
Gram energetyczne sety Tech House, Bass House oraz klubowe remixy.
Moim celem jest stworzenie atmosfery, której uczestnicy długo nie zapomną.
</p>

</section>

<section id="galeria">

<h2 class="title">Galeria</h2>

<div class="gallery">

<img src="https://picsum.photos/600/400?1">

<img src="https://picsum.photos/600/400?2">

<img src="https://picsum.photos/600/400?3">

<img src="https://picsum.photos/600/400?4">

</div>

</section>

<footer>

© 2026 ALGIZ DJ

</footer>

</body>
</html>
